services:
  # --- UNIFIED BACKEND (Python FastAPI) ---
  backend:
    build:
      context: ./apps/api-backend
      dockerfile: Dockerfile
    container_name: easy-pay-backend
    volumes:
      - ./apps/api-backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
      - ./apps/api-backend/.env
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # --- FRONTEND (React / Vite) ---
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: easy-pay-frontend
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web-app/node_modules
      - /app/apps/mobile-app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - NODE_ENV=development
    stdin_open: true
    tty: true
    command: >
      sh -c "npm install --legacy-peer-deps && 
             rm -rf apps/web-app/node_modules/react && 
             rm -rf apps/web-app/node_modules/react-dom && 
             rm -rf apps/web-app/node_modules/.vite && 
             npm run dev:web"
    depends_on:
      - backend

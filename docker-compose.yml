services:
  # --- DATABASE (MongoDB Local) ---
  mongodb:
    image: mongo:latest
    container_name: easy-pay-db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- UNIFIED BACKEND (Python FastAPI) ---
  api-backend:
    build:
      context: ./apps/api-backend
      dockerfile: Dockerfile
    container_name: easy-pay-backend
    volumes:
      - ./apps/api-backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGO_URL=${MONGO_URL}
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      mongodb:
        condition: service_healthy

  # --- WEB APP (React / Vite) ---
  web-app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: easy-pay-web
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web-app/node_modules
      - /app/apps/mobile-app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_USER_SERVICE_URL=http://localhost:8000
      - VITE_GROUP_SERVICE_URL=http://localhost:8000
      - VITE_STATS_SERVICE_URL=http://localhost:8000
      - NODE_ENV=development
    stdin_open: true
    tty: true
    command: >
      sh -c "npm run dev:web"
    depends_on:
      api-backend:
        condition: service_started

volumes:
  mongodb_data:

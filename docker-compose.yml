services:
  # --- BASE DE DATOS LOCAL ---
  mongodb_local:
    image: mongo:latest
    container_name: easy-pay-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # --- MICROSERVICIO DE USUARIOS (Puerto 8001) ---
  user-service:
    build:
      context: ./apps/api-backend
      dockerfile: Dockerfile
    container_name: easy-pay-user-service
    volumes:
      - ./apps/api-backend:/app
    ports:
      - "8001:8000"
    env_file:
      - .env
      - ./apps/api-backend/.env
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - mongodb_local

  # --- MICROSERVICIO DE GRUPOS (Puerto 8002) ---
  group-service:
    build:
      context: ./apps/api-backend
      dockerfile: Dockerfile
    container_name: easy-pay-group-service
    volumes:
      - ./apps/api-backend:/app
    ports:
      - "8002:8000"
    env_file:
      - ./apps/api-backend/.env
    command: uvicorn main_groups:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - mongodb_local

  # --- MICROSERVICIO DE ESTADÍSTICAS (Puerto 8003) ---
  statistics-service:
    build:
      context: ./apps/api-backend
      dockerfile: Dockerfile
    container_name: easy-pay-statistics-service
    volumes:
      - ./apps/api-backend:/app
    ports:
      - "8003:8000"
    env_file:
      - ./apps/api-backend/.env
    command: uvicorn main_stats:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - mongodb_local

  # --- FRONTEND (React / Vite) ---
  dev-env:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: easy-pay-frontend_pruebas
    volumes:
      - .:/app
      # 🚩 ESTOS VOLÚMENES SON VITALES PARA EVITAR EL ERROR DE HOOKS
      - /app/node_modules
      - /app/apps/web-app/node_modules
      - /app/apps/mobile-app/node_modules
    ports:
      - "5173:5173"
    environment:
      # Definimos la URL del backend para que Vite la reconozca
      - VITE_API_URL=http://localhost:8000
      - NODE_ENV=development
    stdin_open: true
    tty: true
    # Forzamos instalación limpia y borrado de caché de Vite en cada arranque crítico
    command: >
      sh -c "npm install --legacy-peer-deps && 
             rm -rf apps/web-app/node_modules/react && 
             rm -rf apps/web-app/node_modules/react-dom && 
             rm -rf apps/web-app/node_modules/.vite && 
             npm run dev:web"
    depends_on:
      - user-service
      - group-service
      - statistics-service

volumes:
  mongo_data:

services:
  # --- UNIFIED BACKEND ---
  # Consolidado para ahorro de RAM y estabilidad en entornos de desarrollo
  unified-api:
    build:
      context: ./apps/api-backend
      dockerfile: Dockerfile
    container_name: easy-pay-backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./apps/api-backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGO_URL=${MONGO_URL}
    # Deshabilitamos --reload si persisten errores de memoria, pero por ahora lo dejamos
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # --- WEB APP (React / Vite) ---
  web-app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: easy-pay-web
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web-app/node_modules
      - /app/apps/mobile-app/node_modules
    ports:
      - "5180:5173"
    env_file:
      - .env
    environment:
      - IS_DOCKER=true
      - VITE_API_URL=/api
      - VITE_API_BASE_URL=/api
      - VITE_USER_SERVICE_URL=/api/auth
      - VITE_GROUP_SERVICE_URL=/api/groups
      - VITE_STATS_SERVICE_URL=/api/stats
      - VITE_OCR_SERVICE_URL=/api/ocr
      - VITE_NOTIFICATION_SERVICE_URL=/api/notifications
      - NODE_ENV=development
    stdin_open: true
    tty: true
    command: >
      sh -c "npm install --legacy-peer-deps && npm run dev:web"
    depends_on:
      - unified-api


<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Easy-Pay - Onboarding Step 2</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#eceef0",
                        "on-secondary-fixed": "#001d36",
                        "tertiary-fixed-dim": "#ffb77b",
                        "error-container": "#ffdad6",
                        "secondary-container": "#b4d4fe",
                        "tertiary-fixed": "#ffdcc2",
                        "on-secondary": "#ffffff",
                        "secondary-fixed": "#d1e4ff",
                        "tertiary-container": "#db7900",
                        "surface-container-highest": "#e0e3e5",
                        "on-primary-container": "#002c4f",
                        "on-surface-variant": "#404752",
                        "secondary-fixed-dim": "#a9c9f2",
                        "primary-fixed": "#d1e4ff",
                        "surface-container-low": "#f2f4f6",
                        "on-secondary-fixed-variant": "#28496b",
                        "surface": "#f7f9fb",
                        "on-background": "#191c1e",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#9ecaff",
                        "surface-tint": "#0061a4",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#eff1f3",
                        "secondary": "#416084",
                        "on-primary-fixed": "#001d36",
                        "inverse-primary": "#9ecaff",
                        "on-tertiary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#e6e8ea",
                        "surface-dim": "#d8dadc",
                        "primary": "#0061a4",
                        "surface-bright": "#f7f9fb",
                        "on-tertiary-container": "#452200",
                        "outline-variant": "#bfc7d4",
                        "on-error-container": "#93000a",
                        "outline": "#707883",
                        "on-tertiary-fixed-variant": "#6d3900",
                        "tertiary": "#904d00",
                        "on-surface": "#191c1e",
                        "on-primary": "#ffffff",
                        "background": "#f7f9fb",
                        "on-tertiary-fixed": "#2e1500",
                        "inverse-surface": "#2d3133",
                        "primary-container": "#2196f3",
                        "on-secondary-container": "#3c5c7f",
                        "on-primary-fixed-variant": "#00497d",
                        "surface-variant": "#e0e3e5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top App Bar (Modified to fit Onboarding context - no shell navigation) -->
<header class="flex justify-between items-center w-full px-6 py-4 bg-surface no-border sticky top-0 z-50">
<button aria-label="Go back" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-low transition-colors text-primary active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="text-xl font-extrabold text-primary font-headline">Easy-Pay</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-1 px-6 pb-32 max-w-md mx-auto w-full flex flex-col relative">
<!-- Background Decorative Element (Tonal Depth) -->
<div class="absolute top-0 right-0 w-64 h-64 bg-primary-container/5 rounded-full blur-3xl -z-10 pointer-events-none transform translate-x-1/4 -translate-y-1/4"></div>
<!-- Progress Stepper -->
<div aria-label="Progress" class="flex items-center justify-center space-x-3 my-6">
<div class="w-2 h-2 rounded-full bg-surface-container-high transition-colors"></div>
<div class="w-6 h-2 rounded-full bg-gradient-to-r from-primary to-primary-container transition-all"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-high transition-colors"></div>
</div>
<!-- Title Section -->
<div class="mb-10 text-center">
<h1 class="text-3xl md:text-4xl font-extrabold font-headline text-on-surface mb-3 tracking-tight">Información de cuenta</h1>
<p class="text-sm md:text-base text-on-surface-variant font-body">Completa tus datos para mayor seguridad</p>
</div>
<!-- Form Fields -->
<div class="space-y-6">
<!-- Personal Info Section -->
<div class="bg-surface-container-lowest rounded-xl p-5 shadow-[0_4px_32px_rgba(25,28,30,0.04)] border border-outline-variant/15 relative overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
<div class="relative z-10 space-y-5">
<!-- Email Field -->
<div class="flex flex-col">
<label class="text-xs font-semibold text-on-surface-variant mb-1.5 uppercase tracking-wider font-label" for="email">Correo Electrónico</label>
<div class="relative">
<input class="w-full bg-surface rounded-lg border-0 px-4 py-3 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-fixed-dim focus:bg-surface-bright transition-all" id="email" placeholder="tu@email.com" type="email"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline" style="font-variation-settings: 'FILL' 0;">mail</span>
</div>
</div>
<!-- Full Name Field -->
<div class="flex flex-col">
<label class="text-xs font-semibold text-on-surface-variant mb-1.5 uppercase tracking-wider font-label" for="fullName">Nombre Completo</label>
<div class="relative">
<input class="w-full bg-surface rounded-lg border-0 px-4 py-3 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-fixed-dim focus:bg-surface-bright transition-all" id="fullName" placeholder="Ej. Juan Pérez" type="text"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline" style="font-variation-settings: 'FILL' 0;">person</span>
</div>
</div>
<!-- Date of Birth Field -->
<div class="flex flex-col">
<label class="text-xs font-semibold text-on-surface-variant mb-1.5 uppercase tracking-wider font-label" for="dob">Fecha de Nacimiento</label>
<div class="relative">
<input class="w-full bg-surface rounded-lg border-0 px-4 py-3 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-fixed-dim focus:bg-surface-bright transition-all" id="dob" type="date"/>
<!-- Native date pickers usually have their own icon, but we can style around it if needed -->
</div>
</div>
</div>
</div>
<!-- Security Section -->
<div class="mt-8">
<h2 class="text-lg font-bold font-headline text-on-surface mb-4 flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">shield_lock</span>
                    Seguridad
                </h2>
<div class="bg-surface-container-lowest rounded-xl p-5 shadow-[0_4px_32px_rgba(25,28,30,0.04)] border border-outline-variant/15">
<div class="flex flex-col">
<label class="text-xs font-semibold text-on-surface-variant mb-1.5 uppercase tracking-wider font-label" for="password">Contraseña</label>
<div class="relative">
<input class="w-full bg-surface rounded-lg border-0 px-4 py-3 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-fixed-dim focus:bg-surface-bright transition-all" id="password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
<p class="text-[0.70rem] text-secondary mt-2 flex items-start gap-1 font-body">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 0;">info</span>
                            Mínimo 8 caracteres, una mayúscula y un número
                        </p>
</div>
</div>
</div>
</div>
</main>
<!-- Fixed Footer Actions -->
<div class="fixed bottom-0 left-0 right-0 bg-surface/90 backdrop-blur-[20px] p-6 border-t border-outline-variant/15 z-40">
<div class="max-w-md mx-auto flex flex-col gap-3">
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold font-body text-base py-4 rounded-xl shadow-[0_8px_16px_rgba(0,97,164,0.2)] hover:shadow-[0_12px_24px_rgba(0,97,164,0.3)] active:scale-[0.98] transition-all flex justify-center items-center gap-2">
                Finalizar y Continuar
                <span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
<button class="w-full text-secondary font-semibold font-body text-sm py-3 rounded-xl hover:bg-surface-container-low transition-colors active:scale-[0.98]">
                Omitir por ahora
            </button>
</div>
</div>
</body></html>

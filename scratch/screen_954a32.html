<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Easy-Pay - Onboarding</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts: Manrope & Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "outline-variant": "#bfc7d4",
                    "on-tertiary-fixed-variant": "#6d3900",
                    "on-primary-fixed": "#001d36",
                    "on-primary-container": "#002c4f",
                    "secondary": "#416084",
                    "on-primary": "#ffffff",
                    "primary-fixed-dim": "#9ecaff",
                    "surface-container": "#eceef0",
                    "secondary-fixed": "#d1e4ff",
                    "primary-fixed": "#d1e4ff",
                    "on-tertiary": "#ffffff",
                    "on-secondary-container": "#3c5c7f",
                    "on-secondary-fixed-variant": "#28496b",
                    "secondary-fixed-dim": "#a9c9f2",
                    "surface": "#f7f9fb",
                    "on-tertiary-container": "#452200",
                    "inverse-primary": "#9ecaff",
                    "tertiary-fixed-dim": "#ffb77b",
                    "surface-tint": "#0061a4",
                    "primary-container": "#2196f3",
                    "primary": "#0061a4",
                    "surface-bright": "#f7f9fb",
                    "on-primary-fixed-variant": "#00497d",
                    "surface-container-high": "#e6e8ea",
                    "on-error": "#ffffff",
                    "inverse-on-surface": "#eff1f3",
                    "tertiary": "#904d00",
                    "outline": "#707883",
                    "surface-container-lowest": "#ffffff",
                    "secondary-container": "#b4d4fe",
                    "error": "#ba1a1a",
                    "on-surface": "#191c1e",
                    "tertiary-fixed": "#ffdcc2",
                    "on-tertiary-fixed": "#2e1500",
                    "on-secondary-fixed": "#001d36",
                    "surface-container-highest": "#e0e3e5",
                    "on-background": "#191c1e",
                    "surface-dim": "#d8dadc",
                    "background": "#f7f9fb",
                    "on-error-container": "#93000a",
                    "tertiary-container": "#db7900",
                    "surface-container-low": "#f2f4f6",
                    "on-secondary": "#ffffff",
                    "on-surface-variant": "#404752",
                    "inverse-surface": "#2d3133",
                    "surface-variant": "#e0e3e5",
                    "error-container": "#ffdad6"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "2xl": "1.5rem",
                    "full": "9999px"
            },
            "spacing": {},
            "fontFamily": {
                    "headline": ["Manrope", "sans-serif"],
                    "body": ["Inter", "sans-serif"],
                    "label": ["Inter", "sans-serif"]
            }
          },
        },
      }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .tap-highlight-none {
                -webkit-tap-highlight-color: transparent;
            }
            .pb-safe {
                padding-bottom: env(safe-area-inset-bottom);
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col antialiased selection:bg-primary/20">
<!-- TopAppBar (Shared Component Executed Exactly + Stepper Integrated Below) -->
<header class="bg-[#F7F9FB] dark:bg-[#191C1E] docked full-width top-0 z-40">
<div class="flex justify-between items-center px-6 h-16 w-full max-w-screen-xl mx-auto">
<!-- Leading Icon -->
<button class="text-[#64748B] dark:text-[#94A3B8] hover:bg-[#F2F4F6] dark:hover:bg-[#2C2E30] transition-colors active:scale-95 duration-150 p-2 rounded-full tap-highlight-none flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back" data-weight="regular">arrow_back</span>
</button>
<!-- Headline / Brand -->
<h1 class="font-['Manrope'] font-bold text-xl tracking-tight text-[#191C1E] dark:text-[#F7F9FB]">Easy-Pay</h1>
<!-- Trailing (Empty for balance) -->
<div class="w-10"></div>
</div>
<!-- Separation Logic (Shadow/Line) -->
<div class="bg-[#F2F4F6] dark:bg-[#2C2E30] h-[1px] w-full flat no shadows"></div>
<!-- Onboarding Progress Stepper -->
<div class="flex items-center justify-center space-x-2 py-4">
<div aria-label="Step 1 completed" class="h-2 w-2 rounded-full bg-primary"></div>
<div aria-label="Step 2 active" class="h-2 w-6 rounded-full bg-primary-container"></div>
<div aria-label="Step 3 pending" class="h-2 w-2 rounded-full bg-surface-container-high"></div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-6 pt-4 pb-32 max-w-md mx-auto w-full">
<!-- Typography: Editorial Authority -->
<div class="space-y-2 mb-10 text-center">
<h2 class="font-headline font-extrabold text-3xl tracking-tight text-on-surface">Completemos tu perfil</h2>
<p class="font-body text-base text-on-surface-variant">¿Cómo prefieres que te llamen?</p>
</div>
<!-- Visual Interactive Component: Avatar Upload -->
<div class="flex justify-center mb-10">
<div class="relative w-32 h-32 rounded-full bg-surface-container-highest flex items-center justify-center shadow-[0_8px_32px_rgba(25,28,30,0.04)] transition-transform active:scale-95 duration-200 cursor-pointer">
<!-- Placeholder Icon -->
<span class="material-symbols-outlined text-outline-variant text-5xl" data-icon="person">person</span>
<!-- Camera Badge -->
<button class="absolute bottom-0 right-0 w-10 h-10 bg-primary-container text-on-primary rounded-full flex items-center justify-center shadow-md hover:bg-primary transition-colors border-2 border-surface">
<span class="material-symbols-outlined text-[20px]" data-icon="photo_camera" data-weight="fill" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</button>
</div>
</div>
<!-- Form Elements -->
<div class="space-y-8">
<!-- Text Input: Nombre Público -->
<div class="flex flex-col space-y-1.5">
<label class="font-label text-sm font-medium text-on-surface-variant px-1" for="publicName">Nombre Público</label>
<input class="w-full bg-surface-container-lowest text-on-surface rounded-xl px-4 py-4 font-body text-base border-none shadow-sm focus:bg-surface-bright focus:ring-2 focus:ring-primary-fixed-dim transition-all outline-none placeholder:text-outline-variant" id="publicName" placeholder="Ej. Alex" type="text"/>
</div>
<!-- Currency Selection: Tonal Depth & No-Line Rule -->
<div class="flex flex-col space-y-3">
<label class="font-label text-sm font-medium text-on-surface-variant px-1">Moneda Principal</label>
<div class="flex space-x-3">
<!-- Active Option (MXN) -->
<button class="flex-1 py-4 rounded-xl flex items-center justify-center font-label font-semibold text-sm transition-all border-2 border-primary-container bg-primary-container/10 text-primary">
                        MXN
                    </button>
<!-- Inactive Option (USD) -->
<button class="flex-1 py-4 rounded-xl flex items-center justify-center font-label font-medium text-sm transition-all border-2 border-transparent bg-surface-container-high text-on-surface-variant hover:bg-surface-container-highest">
                        USD
                    </button>
<!-- Inactive Option (EUR) -->
<button class="flex-1 py-4 rounded-xl flex items-center justify-center font-label font-medium text-sm transition-all border-2 border-transparent bg-surface-container-high text-on-surface-variant hover:bg-surface-container-highest">
                        EUR
                    </button>
</div>
</div>
</div>
</main>
<!-- Fixed Footer Container -->
<footer class="fixed bottom-0 w-full bg-gradient-to-t from-surface via-surface to-transparent pt-8 pb-6 px-6 max-w-md left-1/2 -translate-x-1/2 z-50">
<div class="flex flex-col space-y-3">
<!-- Primary CTA -->
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-2xl py-4 font-label font-bold text-lg text-center shadow-[0_8px_32px_rgba(0,97,164,0.2)] hover:opacity-90 transition-opacity active:scale-[0.98] duration-200 tap-highlight-none">
                Siguiente Paso
            </button>
<!-- Tertiary CTA (Subtle) -->
<button class="w-full py-3 text-center text-outline font-label font-medium text-sm hover:text-on-surface transition-colors tap-highlight-none">
                Omitir por ahora
            </button>
</div>
<div class="pb-safe"></div>
</footer>
</body></html>
